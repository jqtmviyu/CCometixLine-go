theme = "default"

# 单位为秒；0 表示每次刷新重新采集。
[cache]
git_seconds = 3
environment_seconds = 60

[style]
separator = " | "

[layout]
task = ["task.status", "task.name", "task.label", "task.elapsed", "task.trend"]

[[layout.lines]]
segments = ["model", "effort", "directory", "git", "context_window"]

[[layout.lines]]
segments = ["environment", "cache", "cache.cold_cost", "cost", "session"]
