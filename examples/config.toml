theme = "default"

[style]
separator = " | "

[layout]
task = ["task.status", "task.name", "task.label", "task.elapsed", "task.trend"]

[[layout.lines]]
segments = ["model", "effort", "directory", "git", "environment"]

[[layout.lines]]
segments = ["context_window", "context.breakdown", "cache", "cache.cold_cost", "cost", "session", "timing.ttft", "timing.tps"]

[[layout.lines]]
segments = ["activity.tools", "activity.agents"]
